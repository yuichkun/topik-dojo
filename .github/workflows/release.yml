name: Release iOS

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    name: EAS Build & Submit (iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute build number
        id: bn
        run: echo "value=$((100 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - name: EAS Build (iOS production)
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.bn.outputs.value }}
        run: eas build --platform ios --profile production --non-interactive

      - name: EAS Submit (App Store Connect)
        run: eas submit --platform ios --profile production --latest --non-interactive
